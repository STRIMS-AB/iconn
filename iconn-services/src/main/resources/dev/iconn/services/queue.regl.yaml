# Where messages are sent and read, real: its connection details. Open: any other field is kept as written,
# a block too (headers, security...). Chosen when the service has no mock.
types:
  Text: { type: STRING, rules: [notNull, notEmpty] }
  Port: { type: INTEGER, rules: [notNull, { greaterThanOrEqual: 1 }, { lessThanOrEqual: 65535 }] }
fields:
  type: { type: STRING, rules: [notNull, { enum: [queue] }] }
  engine: Text
  topic: Text
  port: { type: INTEGER, rules: [{ greaterThanOrEqual: 1 }, { lessThanOrEqual: 65535 }] }
